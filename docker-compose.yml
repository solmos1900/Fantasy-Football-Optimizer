services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: gridiron
      POSTGRES_DB: gridiron_iq
    volumes:
      - gridiron_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron -d gridiron_iq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gridiron_pgdata:
